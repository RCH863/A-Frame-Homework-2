<!DOCTYPE html
<html>
    <head> 
        <title>A Simple Scene</title> 
        <script src= 
        "https://aframe.io/releases/1.7.0/aframe.min.js"> 
    </script>
    </head>
    <body> 
        <a-scene> 
        <a-assets>
           <img 
           id="sky" 
           src="assets\sky.jpg">
           <img id="roof-base" src="assets\roofcolor.png">
            <img id="roof-base" src="assets\roofao.png">
            <img id="roof-base" src="assets\roofnormal.png">
           <img id="leaf-base" src="assets\leafcolor.jpg">
            <img id="leaf-base" src="assets\leafao.jpg">
            <img id="leaf-base" src="assets\leafnormal.jpg">
        <a-asset-item
            id="bookcase"
            src="assets\bookcase.glb">
        </a-asset-item>
        <a-asset-item
            id="bed"
            src="assets\bed.glb">
        </a-asset-item>
        <a-asset-item
            id="nightstand"
            src="assets\nightstand.glb">
        </a-asset-item>
        <a-asset-item
            id="couch"
            src="assets\couch.glb">
        </a-asset-item>
        <a-asset-item
            id="diningtable"
            src="assets\diningtable.glb">
        </a-asset-item>
        </a-assets>
        <a-entity
        gltf-model="#diningtable"
        position="-9 0 0"
        rotation="0 0 0"
        scale=".035 .035 .035">
        </a-entity>
        <a-entity
        gltf-model="#bookcase"
        position="4.8 .1 -9"
        scale=".6 .6 .6"
        rotation="0 270 0">
        </a-entity>
        <a-entity
        gltf-model="#couch"
        position="-4.4 0 -8"
        rotation="0 90 0"
        scale=".5 .5 .5">
        </a-entity>
        <a-entity
        gltf-model="#bed"
        position="-5 0 -13"
        rotation="0 180 0"
        scale="2.3 2.3 2.3">
        </a-entity>
        <a-entity
        gltf-model="#nightstand"
        position="-2.5 0 -15"
        rotation="0 180 0"
        scale="3 3 3">
        </a-entity>
        <a-sky
        src="#sky"
        >
        </a-sky>
        <a-plane 
            color="aliceblue"
            position="0 0 0" 
            rotation="-90 0 0" 
            width="500" 
            height="500" 
            > 
        </a-plane> 
     
    <a-mixin
id="wallcolor"
color="lightsteelblue"
>
</a-mixin>
<a-box
    mixin="wallcolor"
    position="0 1.5 -16"
    rotation="0 0 0"
    width="10"
    height="3"
    depth="0.1"
>
</a-box>
<a-box
    mixin="wallcolor"
    position="-5 1.5 -11"
    rotation="0 90 0"
    width="10"
    height="3"
    depth="0.1"
    >
</a-box>
<a-box
    color="saddlebrown"
    position="0 1.25 -6"
    rotation="0 90 0"
    width=".1"
    height="2.5"
    depth="1.5"
    >
</a-box>
<a-box
    mixin="wallcolor"
    position="5 1.5 -11"
    rotation="0 90 0"
    width="10"
    height="3"
    depth="0.1"
    >
</a-box>
<a-box
    mixin="wallcolor"
    position="-2.875 1.5 -6"
    rotation="0 0 0"
    width="4.25"
    height="3"
    depth="0.1"
    >
</a-box>
<a-box
    mixin="wallcolor"
    position="2.875 1.5 -6"
    rotation="0 0 0"
    width="4.25"
    height="3"
    depth="0.1"
    >
</a-box>
<a-box
    mixin="wallcolor"
    position="0 2.75 -6"
    rotation="0 0 0"
    width="1.5"
    height="0.5"
    depth="0.1"
    >
</a-box>
<a-box
    color="tan"
    position="0 0 -11"
    width="10"
    depth="10"
    height="0.1"
    >
</a-box>
<a-box
    mixin="roof"
    color="darkgray"
    position="0 3 -11"
    width="12"
    depth="15"
    height="0.25"
    >
</a-box>
<a-mixin
id="roof"
material = 
"src: #roof-base; 
repeat: 2 2; 
ambientOcclusionMap: #roofao; 
ambientOcclusionTextureRepeat: 2 2; 
normalMap: #roofnormal; 
normalTextureRepeat: 2 2;"
>
</a-mixin>
<a-mixin
id="leaf"
material = 
"src: #leaf-base; 
repeat: 2 2; 
ambientOcclusionMap: #leafao; 
ambientOcclusionTextureRepeat: 2 2; 
normalMap: #leafnormal; 
normalTextureRepeat: 2 2;"
>
</a-mixin>
<a-cylinder
    position="5.5 0 -4"
    radius=".2"
    height="5.6"
    color="saddlebrown"
    >
</a-cylinder>
<a-cylinder
    position="-5.5 0 -4"
    radius=".2"
    height="5.6"
    color="saddlebrown"
    >
</a-cylinder>
<a-cone
position="4.5 2.5 -4"
rotation="0 0 180"
color="lightcyan"
radius-bottom=".1"
height="1"
>
</a-cone>
<a-cone
position="4.3 2.5 -4"
rotation="0 0 180"
color="lightcyan"
radius-bottom=".1"
height="1"
>
</a-cone>
<a-cone
position="4.1 2.5 -4"
rotation="0 0 180"
color="lightcyan"
radius-bottom=".1"
height="1"
>
</a-cone>
<a-cone
position="3.9 2.5 -4"
rotation="0 0 180"
color="lightcyan"
radius-bottom=".1"
height="1"
>
</a-cone>
<a-cone
position="-3.9 2.5 -4"
rotation="0 0 180"
color="lightcyan"
radius-bottom=".1"
height="1"
>
</a-cone>
<a-cone
position="-4.1 2.5 -4"
rotation="0 0 180"
color="lightcyan"
radius-bottom=".1"
height="1"
>
</a-cone>
<a-sphere
position="-.6 1.2 -6"
color="gold"
radius=".1"
>
</a-sphere>
<a-cylinder
    position="3.8 0 -14.8"
    color="saddlebrown"
    radius=".2"
    >
</a-cylinder>
<a-cone
    mixin="leaf"
    position="3.8 1 -14.8"
    color="green"
    >
</a-cone>
<a-cone
    mixin="leaf"
    position="3.8 1.5 -14.8"
    color="green"
    >
</a-cone>
<a-cone
    mixin="leaf"
    position="3.8 2 -14.8"
    color="green"
    >
</a-cone>
</a-scene>
</body>
</html>
